name: Release v0.1.0

on:
  push:
    tags:
      - v0.1.0

permissions: {}

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  validate-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch every public branch, tag, and pull-request head
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'
          git config --local --unset-all http.https://github.com/.extraheader
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null
          then
            echo "checkout credential cleanup failed" >&2
            exit 1
          fi

      - name: Require the exact verified annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v0.1.0"
          tag_object="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{tag}")"
          test "$(git cat-file -t "${tag_object}")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          verified="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.verification.verified and (.verification.reason == "valid")'
          )"
          test "${verified}" = "true"

      - name: Require immutable releases before any publish work
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          immutable="$(
            gh api \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          test "${immutable}" = "true"

      - name: Require the release commit on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          test -n "${default_branch}"
          comparison_status="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${default_branch}" \
              --jq '.status'
          )"
          test "${comparison_status}" = "ahead" \
            || test "${comparison_status}" = "identical"

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.12"
          version: "0.9.8"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          mkdir -p release-audit
          uv sync --frozen --all-groups
          npm --prefix frontend ci

      - name: Run release validation
        run: |
          uv run ruff check backend scripts examples
          uv run pytest
          npm --prefix frontend run lint
          npm --prefix frontend test -- --run

      - name: Run frontend validation
        run: npm run build
        working-directory: frontend

      - name: Run migration smoke
        run: uv run python scripts/migration_smoke.py

      - name: Run disposable Docker smoke
        run: python3 scripts/docker_smoke.py

      - name: Audit Python dependencies
        run: |
          uv export \
            --frozen \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file release-audit/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement release-audit/requirements.txt \
            --format json \
            --output release-audit/pip-audit.json

      - name: Require zero frontend dependency vulnerabilities
        run: |
          set -uo pipefail
          set +e
          npm --prefix frontend audit --json > release-audit/npm-audit.json
          audit_status="$?"
          set -e
          test "${audit_status}" -eq 0 || test "${audit_status}" -eq 1
          uv run python scripts/check_npm_audit.py \
            --repository . \
            --audit-report release-audit/npm-audit.json

      - name: Scan source, dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: release-audit/trivy-fs.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan complete Git history with Gitleaks
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          mkdir -p release-audit
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . \
            --no-banner \
            --log-opts="--all HEAD" \
            --redact \
            --report-format json \
            --report-path release-audit/gitleaks.json

      - name: Run redacted release-history audit
        run: >-
          uv run python scripts/audit_release_history.py
          --repository .
          --output release-audit/release-history.json
          --public-gate

      - name: Build and compare release artifacts twice
        run: >-
          uv run python scripts/build_release_artifacts.py
          --version 0.1.0
          --revision "${GITHUB_SHA}"
          --output-dir release-artifacts

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/forecast-loop-0.1.0.spdx.json
          upload-artifact: false

      - name: Add SBOM to release checksums
        run: |
          cd release-artifacts
          sha256sum forecast-loop-0.1.0.spdx.json >> SHA256SUMS
          LC_ALL=C sort --key=2,2 --output=SHA256SUMS SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Audit every release artifact before upload
        run: >-
          uv run python scripts/audit_release_artifacts.py
          --repository .
          --artifact-dir release-artifacts

      - name: Require the exact release asset set
        run: |
          set -euo pipefail
          expected="$(
            printf '%s\n' \
              SHA256SUMS \
              forecast-loop-0.1.0-frontend.tar.gz \
              forecast-loop-0.1.0-source.tar.gz \
              forecast-loop-0.1.0.spdx.json \
              forecast_loop-0.1.0-py3-none-any.whl \
              forecast_loop-0.1.0.tar.gz
          )"
          actual="$(
            find release-artifacts -mindepth 1 -maxdepth 1 -printf '%f\n' \
              | LC_ALL=C sort
          )"
          test "${actual}" = "${expected}"
          while IFS= read -r name
          do
            test -f "release-artifacts/${name}"
            test ! -L "release-artifacts/${name}"
          done <<EOF
          ${expected}
          EOF
          expected_checksums="$(
            printf '%s\n' \
              forecast-loop-0.1.0-frontend.tar.gz \
              forecast-loop-0.1.0-source.tar.gz \
              forecast-loop-0.1.0.spdx.json \
              forecast_loop-0.1.0-py3-none-any.whl \
              forecast_loop-0.1.0.tar.gz
          )"
          actual_checksums="$(
            sed -n 's/^[0-9a-f]\{64\}  //p' release-artifacts/SHA256SUMS \
              | LC_ALL=C sort
          )"
          test "${actual_checksums}" = "${expected_checksums}"
          (
            cd release-artifacts
            sha256sum --strict --check SHA256SUMS
          )

      - name: Build release container
        run: >-
          docker build
          --file backend/Dockerfile
          --tag forecast-loop:0.1.0
          .

      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: forecast-loop:0.1.0
          scanners: vuln,secret,misconfig
          format: sarif
          output: release-audit/trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload release audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.1.0-release-audit
          path: release-audit
          if-no-files-found: warn
          retention-days: 90

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forecast-loop-v0.1.0
          path: |
            release-artifacts/SHA256SUMS
            release-artifacts/forecast-loop-0.1.0-frontend.tar.gz
            release-artifacts/forecast-loop-0.1.0-source.tar.gz
            release-artifacts/forecast-loop-0.1.0.spdx.json
            release-artifacts/forecast_loop-0.1.0-py3-none-any.whl
            release-artifacts/forecast_loop-0.1.0.tar.gz
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: validate-build
    permissions:
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forecast-loop-v0.1.0
          path: release-artifacts

      - name: Verify the exact attestation subjects
        run: |
          set -euo pipefail
          expected="$(
            printf '%s\n' \
              SHA256SUMS \
              forecast-loop-0.1.0-frontend.tar.gz \
              forecast-loop-0.1.0-source.tar.gz \
              forecast-loop-0.1.0.spdx.json \
              forecast_loop-0.1.0-py3-none-any.whl \
              forecast_loop-0.1.0.tar.gz
          )"
          actual="$(
            find release-artifacts -mindepth 1 -maxdepth 1 -printf '%f\n' \
              | LC_ALL=C sort
          )"
          test "${actual}" = "${expected}"
          while IFS= read -r name
          do
            test -f "release-artifacts/${name}"
            test ! -L "release-artifacts/${name}"
          done <<EOF
          ${expected}
          EOF
          (
            cd release-artifacts
            sha256sum --strict --check SHA256SUMS
          )

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-artifacts/SHA256SUMS
            release-artifacts/forecast-loop-0.1.0-frontend.tar.gz
            release-artifacts/forecast-loop-0.1.0-source.tar.gz
            release-artifacts/forecast-loop-0.1.0.spdx.json
            release-artifacts/forecast_loop-0.1.0-py3-none-any.whl
            release-artifacts/forecast_loop-0.1.0.tar.gz

  publish:
    needs: attest
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - name: Check out the reviewed release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forecast-loop-v0.1.0
          path: release-artifacts

      - name: Verify the exact publish set
        run: |
          set -euo pipefail
          expected="$(
            printf '%s\n' \
              SHA256SUMS \
              forecast-loop-0.1.0-frontend.tar.gz \
              forecast-loop-0.1.0-source.tar.gz \
              forecast-loop-0.1.0.spdx.json \
              forecast_loop-0.1.0-py3-none-any.whl \
              forecast_loop-0.1.0.tar.gz
          )"
          actual="$(
            find release-artifacts -mindepth 1 -maxdepth 1 -printf '%f\n' \
              | LC_ALL=C sort
          )"
          test "${actual}" = "${expected}"
          while IFS= read -r name
          do
            test -f "release-artifacts/${name}"
            test ! -L "release-artifacts/${name}"
          done <<EOF
          ${expected}
          EOF
          (
            cd release-artifacts
            sha256sum --strict --check SHA256SUMS
          )

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_READ_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_ADMIN_READ_TOKEN:-}"
          admin_read_token="${RELEASE_ADMIN_READ_TOKEN}"
          unset RELEASE_ADMIN_READ_TOKEN
          immutable="$(
            GH_TOKEN="${admin_read_token}" gh api \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          unset admin_read_token
          test "${immutable}" = "true"
          gh release create v0.1.0 \
            release-artifacts/SHA256SUMS \
            release-artifacts/forecast-loop-0.1.0-frontend.tar.gz \
            release-artifacts/forecast-loop-0.1.0-source.tar.gz \
            release-artifacts/forecast-loop-0.1.0.spdx.json \
            release-artifacts/forecast_loop-0.1.0-py3-none-any.whl \
            release-artifacts/forecast_loop-0.1.0.tar.gz \
            --verify-tag \
            --title "forecast-loop v0.1.0" \
            --notes-file docs/releases/v0.1.0.md

      - name: Require GitHub Release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          immutable="$(
            gh release view v0.1.0 \
              --json isImmutable \
              --jq '.isImmutable'
          )"
          test "${immutable}" = "true"
