name: Security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every public branch, tag, and pull-request head
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Audit the checked-out public tree
        run: python3 scripts/audit_public_boundary.py --repository .

      - name: Audit every reachable public ref
        run: >-
          python3 scripts/audit_release_history.py
          --repository .
          --public-gate

  dependency-review:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          github.event.repository.private == false ||
          vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every public branch, tag, and pull-request head
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every public branch, tag, and pull-request head
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.12"
          version: "0.9.8"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare report directory
        run: mkdir -p security-reports .security/tools

      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-groups
          npm --prefix frontend ci

      - name: Scan complete Git history with Gitleaks
        id: gitleaks
        continue-on-error: true
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive=".security/tools/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory .security/tools gitleaks
          .security/tools/gitleaks git . \
            --no-banner \
            --log-opts="--all HEAD" \
            --redact \
            --report-format json \
            --report-path security-reports/gitleaks.json

      - name: Run redacted release-history audit
        id: history-audit
        continue-on-error: true
        run: >-
          uv run python scripts/audit_release_history.py
          --repository .
          --output security-reports/release-history.json
          --public-gate

      - name: Audit Python dependencies
        id: python-audit
        continue-on-error: true
        run: |
          uv export \
            --frozen \
            --all-groups \
            --no-emit-project \
            --no-hashes \
            --output-file security-reports/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement security-reports/requirements.txt \
            --format json \
            --output security-reports/pip-audit.json

      - name: Require zero frontend dependency vulnerabilities
        id: npm-audit
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          npm --prefix frontend audit --json > security-reports/npm-audit.json
          audit_status="$?"
          set -e
          test "${audit_status}" -eq 0 || test "${audit_status}" -eq 1
          uv run python scripts/check_npm_audit.py \
            --repository . \
            --audit-report security-reports/npm-audit.json

      - name: Scan source, dependency, secret, and configuration risks
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: security-reports/trivy-fs.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate source SBOM
        id: source-sbom
        continue-on-error: true
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: security-reports/source.spdx.json
          upload-artifact: false

      - name: Upload source security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-security-reports
          path: security-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce source security gates
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          HISTORY_AUDIT_OUTCOME: ${{ steps.history-audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm-audit.outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ steps.python-audit.outcome }}
          SBOM_OUTCOME: ${{ steps.source-sbom.outcome }}
          TRIVY_FS_OUTCOME: ${{ steps.trivy-fs.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "${GITLEAKS_OUTCOME}" \
            "${HISTORY_AUDIT_OUTCOME}" \
            "${NPM_AUDIT_OUTCOME}" \
            "${PYTHON_AUDIT_OUTCOME}" \
            "${SBOM_OUTCOME}" \
            "${TRIVY_FS_OUTCOME}"
          do
            test "${outcome}" = "success"
          done

  container-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release container
        run: >-
          docker build
          --file backend/Dockerfile
          --tag forecast-loop:security
          .

      - name: Scan release container
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: forecast-loop:security
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate container SBOM
        id: container-sbom
        continue-on-error: true
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: forecast-loop:security
          format: spdx-json
          output-file: container.spdx.json
          upload-artifact: false

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-reports
          path: |
            trivy-image.sarif
            container.spdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce container security gates
        if: always()
        env:
          SBOM_OUTCOME: ${{ steps.container-sbom.outcome }}
          TRIVY_IMAGE_OUTCOME: ${{ steps.trivy-image.outcome }}
        run: |
          test "${SBOM_OUTCOME}" = "success"
          test "${TRIVY_IMAGE_OUTCOME}" = "success"

  security-gate:
    if: always()
    needs:
      - privacy-boundary
      - dependency-review
      - source-audit
      - container-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable security job
        env:
          CONTAINER: ${{ needs.container-audit.result }}
          DEPENDENCY: ${{ needs.dependency-review.result }}
          PRIVACY: ${{ needs.privacy-boundary.result }}
          SOURCE: ${{ needs.source-audit.result }}
        run: |
          test "${PRIVACY}" = "success"
          test "${SOURCE}" = "success"
          test "${CONTAINER}" = "success"
          test "${DEPENDENCY}" = "success" || test "${DEPENDENCY}" = "skipped"
