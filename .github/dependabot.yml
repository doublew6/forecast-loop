version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - python
    groups:
      python-non-breaking:
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    labels:
      - dependencies
      - frontend
    groups:
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - "@vitest/*"
      frontend-non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - "@vitest/*"
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
